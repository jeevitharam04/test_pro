services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: educare
      POSTGRES_PASSWORD: educare
      POSTGRES_DB: educare
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educare"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://educare:educare@postgres:5432/educare?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-secret-value-change-before-production
      LOG_LEVEL: info
    ports:
      - "3000:3000"

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://educare:educare@postgres:5432/educare?schema=public
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-}
    command: ["npm", "run", "worker"]

volumes:
  postgres-data:
  redis-data:
