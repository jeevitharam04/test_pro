name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: educare
          POSTGRES_PASSWORD: educare
          POSTGRES_DB: educare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://educare:educare@localhost:5432/educare?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-value-long-enough-for-jwt
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run test
      - run: npm run build
